services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: offerpilot-postgres
    environment:
      POSTGRES_USER: offerpilot
      POSTGRES_PASSWORD: offerPilot@2026
      POSTGRES_DB: offerpilot
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offerpilot -d offerpilot"]
      interval: 10s
      timeout: 5s
      retries: 5
    # PG 内存参数适配 384MB 容器上限
    command: >
      postgres
      -c timezone=Asia/Shanghai
      -c shared_buffers=64MB
      -c effective_cache_size=192MB
      -c maintenance_work_mem=32MB
      -c work_mem=4MB
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M

  redis:
    image: redis:7-alpine
    container_name: offerpilot-redis
    command: redis-server --appendonly yes --maxmemory 100mb --maxmemory-policy allkeys-lru --requirepass offerPilot@2026
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - /data/redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "offerPilot@2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 128M

  backend:
    image: offerpilot-backend:${PROJECT_VERSION:-latest}
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: offerpilot-backend
    volumes:
      - /data/uploads:/app/uploads
      - /data/logs:/app/logs
    # 非敏感配置走 .env.public(可入仓)
    env_file:
      - path: ./env.public
        required: true
    # 敏感第三方 key 走 Docker secrets 挂载,容器内 /run/secrets/<name> 由
    # backend/app/utils/secrets.py 启动期装载到 os.environ。
    # deploy/secrets/ 目录不在仓,首次部署需手动 echo 写入。
    secrets:
      - deepseek_api_key
      - dashscope_api_key
      - dashscope_workspace_id
      - tencent_secret_id
      - tencent_secret_key
      - tencent_sms_app_id
      - volc_asr_api_key
      - volc_realtime_api_key
      - jwt_secret
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1200M

  frontend:
    image: offerpilot-frontend:${PROJECT_VERSION:-latest}
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ""
        PROJECT_VERSION: ${PROJECT_VERSION:-V0.0.0}
    container_name: offerpilot-frontend
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 384M

  nginx:
    image: nginx:alpine
    container_name: offerpilot-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

# ── Docker secrets 定义 ──
# file: 路径相对 docker-compose.yml,首次部署需手工创建 ./secrets/<name> 文件
secrets:
  deepseek_api_key:
    file: ./secrets/deepseek_api_key
  dashscope_api_key:
    file: ./secrets/dashscope_api_key
  dashscope_workspace_id:
    file: ./secrets/dashscope_workspace_id
  tencent_secret_id:
    file: ./secrets/tencent_secret_id
  tencent_secret_key:
    file: ./secrets/tencent_secret_key
  tencent_sms_app_id:
    file: ./secrets/tencent_sms_app_id
  volc_asr_api_key:
    file: ./secrets/volc_asr_api_key
  volc_realtime_api_key:
    file: ./secrets/volc_realtime_api_key
  jwt_secret:
    file: ./secrets/jwt_secret
