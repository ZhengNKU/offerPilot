services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: offerpilot-postgres
    environment:
      POSTGRES_USER: offerpilot
      POSTGRES_PASSWORD: offerpilot123
      POSTGRES_DB: offerpilot
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offerpilot -d offerpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: offerpilot-redis
    command: redis-server --appendonly yes
    volumes:
      - /data/redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: offerpilot-backend:${PROJECT_VERSION:-latest}
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: offerpilot-backend
    volumes:
      - /data/uploads:/app/uploads
      - /data/logs:/app/logs
    env_file:
      - ../backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: offerpilot-frontend:${PROJECT_VERSION:-latest}
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ""
        PROJECT_VERSION: ${PROJECT_VERSION:-V0.0.0}
    container_name: offerpilot-frontend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: offerpilot-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
