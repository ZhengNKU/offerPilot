worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 512;
    gzip_vary on;

    # 上传文件大小限制
    client_max_body_size 60m;

    # ─────────────────────────────────────────────
    #  HTTP · default_server
    #  接所有未匹配请求（IP 直连 + 任意未备案域名）
    #  当前阶段用于：备案前通过 IP 访问
    # ─────────────────────────────────────────────
    server {
        listen 80 default_server;
        server_name _;

        # 后端 API（含 WebSocket）
        location /api/ {
            proxy_pass http://backend:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 前端
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ─────────────────────────────────────────────
    #  HTTP · interviewvar.com 专用
    #  备案后用域名访问 → 强制跳 HTTPS
    #  备案前：域名未解析过来，此 server 不会被命中，无副作用
    # ─────────────────────────────────────────────
    server {
        listen 80;
        server_name interviewvar.com www.interviewvar.com;

        # 腾讯云备案健康探测需要 200
        location /healthz { return 200 'ok'; }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─────────────────────────────────────────────
    #  HTTPS · 备案后启用
    #  备案前：域名未解析，无流量，配置预热完毕
    # ─────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name interviewvar.com www.interviewvar.com;

        ssl_certificate     /etc/nginx/ssl/interviewvar.com_bundle.pem;
        ssl_certificate_key /etc/nginx/ssl/interviewvar.com.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # HSTS（30 天观察期，后续可改 1 年）
        add_header Strict-Transport-Security "max-age=2592000" always;

        # 后端 API（含 WebSocket）
        location /api/ {
            proxy_pass http://backend:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 前端
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
